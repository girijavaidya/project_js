<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Array Traversing</title>
    <script>
        // traversing : one by one element can print or acess using for loop
        let data = [9,45,3,45,78,42,56,77];
        for(let i=0; i<data.length; i++)
    {
        document.write(`Array ${i} is ${data[i]} <br>` )
    }
    
    </script>
</head>
