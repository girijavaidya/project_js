    <script>
          let data = [9,45,3,45,78,42,56,77];

          {

            // parseInt :: is a string is convert into number
            if(el<data.length && typeof parseInt(el)=== "number" && el>=0)
          {

          }else{

             location.reload(); // 🔁 Refresh even after invalid input

          }
