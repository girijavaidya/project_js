<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelectElementById</title>
</head>
<style>
.red-color
{
    color: red;
}
.underline
{
    text-decoration: underline;
}
</style>
<body>
    <nav class="block">
        <p class="paragraph">Welcome to my Website</p>     
    </nav>
    <div class="block">
        <h4>Hey There, My name is <span id="username" >Girija </span></h4>
 <p class="para">Here is a code for you</p>
 <pre><code>console.log('Hey There')</code></pre>
    </div>
    <!-- script part -->
     <script>
        const ele = document.getElementById("username");
      ele.innerText = "Sanket";
   ele.classList.add('red-color', "underline");
      
     </script>
</body>
</html>
