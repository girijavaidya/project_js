<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelectorAll</title>
</head>
<body>
    <nav class="block">
        <p class="paragraph">Welcome to my Website</p>     
    </nav>
    <div class="block">
        <h4>Hey There, My name is <span id="username">Girija Vaidya</span></h4>
 <p class="para">Here is a code for you</p>
 <pre><code>console.log('Hey There')</code></pre>
    </div>
    <script>

        // querySelectorAll it is return an array of element (node list return )
        
        const ele = document.querySelectorAll(".block");
        ele.forEach((e)=>
    {
          console.log(e.innerHTML);
          
    })
    </script>
    </body>
    </html>
